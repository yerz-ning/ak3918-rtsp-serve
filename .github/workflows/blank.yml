name: Build RTSP Demo (AK3918) - Static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ARMv5 uClibc toolchain
        run: |
          wget https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2024.02-1.tar.bz2
          tar -xjf armv5-eabi--uclibc--stable-2024.02-1.tar.bz2
          echo "TOOLCHAIN_PATH=$PWD/armv5-eabi--uclibc--stable-2024.02-1" >> $GITHUB_ENV

      - name: List files (debug)
        run: ls -la

      - name: Compile RTSP demo (static)
        run: |
          export PATH=${{ env.TOOLCHAIN_PATH }}/bin:$PATH
          arm-linux-gcc -static -o ak_rtsp_demo ak_rtsp_demo.c \
            -I. \
            -L. \
            -Wl,--start-group \
            -lapp_rtsp -lapp_net \
            -lmpi_venc \
            -lplat_common -lplat_thread -lplat_vi -lplat_vpss -lplat_ipcsrv -lplat_venc_cb \
            -lakmedialib -lakstreamenc -lakv_encode -lakispsdk -lakuio \
            -lakaudiocodec -lakaudiofilter \
            -Wl,--end-group \
            -lpthread -ldl -lm

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ak_rtsp_demo-armv5-static
          path: ak_rtsp_demo
